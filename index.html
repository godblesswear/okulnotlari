<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ders Notları</title>
<meta name="description" content="Öğrenciler için ders notları, ödev takibi, ağırlıklı not ortalaması hesaplama ve odak sayacı içeren eğitim ve verimlilik platformu.">
<meta name="keywords" content="ders notları, ödev takibi, ortalama hesaplama, öğrenci paneli, eğitim araçları">
<style>
:root{--bg:#070606;--panel:#120d0d;--line:#2a1717;--red:#9b1c1c;--red2:#c42b2b;--text:#d9d0d0;--mute:#7d6e6e;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line)}
header h1{grid-column:1;grid-row:1}
header nav{grid-column:2;grid-row:1;justify-content:center}
header #back{grid-column:3;grid-row:1;justify-self:end}
@media(max-width:700px){header{display:flex;flex-wrap:wrap;justify-content:space-between}header nav{order:3;flex:1 0 100%}}
h1{font-size:17px;font-weight:600;letter-spacing:.2px;cursor:default}
h1 i{display:inline-block;width:9px;height:9px;background:var(--red);border-radius:50%;margin-right:9px}
nav{display:flex;gap:4px}
nav button{background:none;border:0;color:var(--mute);padding:7px 14px;border-radius:6px;font:inherit;cursor:pointer}
nav button:hover{color:var(--text)}
nav button.on{background:var(--red);color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
main{max-width:880px;margin:0 auto;padding:28px 20px 60px}
section{display:none}section.on{display:block}
h2{font-size:20px;font-weight:600;margin-bottom:16px}
textarea,input[type=text],input[type=number]{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:11px 13px;font:inherit}
textarea{min-height:340px;resize:vertical;line-height:1.6}
.row{display:flex;gap:8px;margin-bottom:14px}
.btn{background:var(--red);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--red2)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--mute)}
.btn.ghost:hover{color:var(--text);border-color:var(--red)}
.mute{color:var(--mute);font-size:13px}
ul{list-style:none;padding:0}
li.t{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
li.t.d span{text-decoration:line-through;color:var(--mute)}
li.t span{flex:1}
li.t input{accent-color:var(--red);width:17px;height:17px}
li.t button{background:none;border:0;color:var(--mute);cursor:pointer;font-size:18px}
li.t button:hover{color:var(--red2)}
.grid{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin-bottom:8px}
.res{margin-top:22px;padding:18px;border:1px solid var(--line);border-left:3px solid var(--red);border-radius:8px;background:var(--panel);font-size:18px}
.timer{font-size:64px;font-weight:300;font-variant-numeric:tabular-nums;margin:10px 0 18px}
.tabs2{display:flex;gap:6px;margin-bottom:18px}
.tabs2 button{background:var(--panel);border:1px solid var(--line);color:var(--mute);padding:6px 14px;border-radius:20px;font:inherit;cursor:pointer}
.tabs2 button.on{border-color:var(--red);color:var(--text)}
.pane{display:none;text-align:center}.pane.on{display:block}
canvas{background:#0d0909;border:1px solid var(--line);border-radius:8px;max-width:100%;touch-action:none}
.score{margin:0 0 10px;color:var(--mute)}.score b{color:var(--text)}
.hp{width:min(340px,100%);height:10px;margin:0 auto 10px;background:#1a1111;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.hp i{display:block;height:100%;width:100%;background:var(--red2);transition:width .15s}
#cd{cursor:crosshair}
#lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;text-align:center}
#lgrid button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;color:var(--text);font:inherit;font-size:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center;transition:transform .15s,border-color .15s,box-shadow .15s}
#lgrid button:hover{border-color:var(--red);transform:translateY(-2px);box-shadow:0 4px 18px rgba(255,42,42,.2)}
#lgrid img,#lgrid .ph{width:100%;aspect-ratio:1;border-radius:7px;object-fit:cover;background:#1a1111}
#lgrid .ph{display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:var(--mute)}
#lgrid span.n{line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
#lframe{width:100%;aspect-ratio:16/9;max-height:78vh;background:#000;border:1px solid var(--line);border-radius:8px;overflow:hidden}
#lframe iframe{width:100%;height:100%;border:0;display:block}
.hint{margin-top:12px}
footer{text-align:center;padding:24px 20px 32px;font-size:12px;color:#4a3f3f}
#secret{cursor:default;user-select:none}
#back{display:none}

/* Geçiş efekti */
#fx{position:fixed;inset:0;z-index:99;pointer-events:none;display:none}
#fx.run{display:block}
#fx .bar{position:absolute;left:0;width:100%;background:var(--red2);transform:translateX(-101%);animation:bar .8s cubic-bezier(.7,0,.3,1) both}
#fx .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 clamp(28px,8vw,64px) ui-monospace,"Courier New",monospace;letter-spacing:10px;color:#000;opacity:0;animation:lbl .8s steps(1) both}
@keyframes bar{0%{transform:translateX(-101%)}42%,58%{transform:translateX(0)}100%{transform:translateX(101%)}}
@keyframes lbl{0%,40%{opacity:0}45%{opacity:1;transform:translateX(6px)}50%{transform:translateX(-5px)}55%{opacity:1;transform:none}60%,100%{opacity:0}}

/* Gizli mod: ayrı bir site gibi */
body.gm{--bg:#050000;--panel:#0e0404;--line:#3a0f0f;--red:#ff2a2a;--red2:#ff4d4d;--text:#f0dcdc;--mute:#a07878;
  font-family:ui-monospace,"Courier New",monospace;
  background:linear-gradient(rgba(255,42,42,.07) 1px,transparent 1px) 0 0/42px 42px,linear-gradient(90deg,rgba(255,42,42,.07) 1px,transparent 1px) 0 0/42px 42px,radial-gradient(ellipse at 50% -10%,#3a0808,#050000 65%) fixed}
body.gm::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
body.gm nav,body.gm h2{display:none}
body.gm #back{display:inline-block}
body.gm header{border-bottom:1px solid var(--red);box-shadow:0 2px 22px rgba(255,42,42,.28);justify-content:space-between}
body.gm h1{letter-spacing:7px;font-size:20px;text-shadow:0 0 14px var(--red),2px 0 #00e5ff55,-2px 0 #ff000099;animation:glitch 3.2s infinite}
body.gm h1 i{box-shadow:0 0 12px var(--red)}
body.gm canvas{border-color:var(--red);box-shadow:0 0 28px rgba(255,42,42,.32)}
body.gm .tabs2{justify-content:center}
body.gm .tabs2 button{font-family:inherit;letter-spacing:2px;text-transform:uppercase}
body.gm .tabs2 button.on{background:var(--red);color:#000;border-color:var(--red);box-shadow:0 0 14px rgba(255,42,42,.6)}
body.gm footer{color:#6b3a3a}
@keyframes glitch{0%,90%,100%{transform:none}92%{transform:translate(3px,-1px)}94%{transform:translate(-4px,1px)}96%{transform:translate(2px,0)}}
@media(prefers-reduced-motion:reduce){#fx .bar,#fx .lbl,body.gm h1{animation:none!important}}
@media(max-width:560px){.grid{grid-template-columns:1fr 1fr}.timer{font-size:48px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1 id="logo"><i></i><span id="logoTxt">Ders Notları</span></h1>
  <button class="btn ghost" id="back">← Çık</button>
  <nav id="nav">
    <button data-t="notes" class="on">Notlar</button>
    <button data-t="todo">Görevler</button>
    <button data-t="avg">Ortalama</button>
    <button data-t="focus">Odak</button>
  </nav>
</header>
<main>

<section id="notes" class="on">
  <h2>Notlar</h2>
  <textarea id="noteArea" placeholder="Ders notlarını buraya yaz. Otomatik kaydedilir."></textarea>
  <p class="mute" id="noteInfo" style="margin-top:8px"></p>
</section>

<section id="todo">
  <h2>Görevler</h2>
  <div class="row"><input type="text" id="todoIn" placeholder="Ödev, sınav, proje…"><button class="btn" id="todoAdd">Ekle</button></div>
  <ul id="todoList"></ul>
</section>

<section id="avg">
  <h2>Ağırlıklı not ortalaması</h2>
  <div id="avgRows"></div>
  <div class="row" style="margin-top:12px"><button class="btn ghost" id="avgAdd">Ders ekle</button><button class="btn" id="avgCalc">Hesapla</button></div>
  <div class="res" id="avgRes">Ortalama: –</div>
</section>

<section id="focus">
  <h2>Odak sayacı</h2>
  <p class="mute">25 dakika çalış, 5 dakika dinlen.</p>
  <div class="timer" id="tm">25:00</div>
  <div class="row"><button class="btn" id="tmGo">Başlat</button><button class="btn ghost" id="tmReset">Sıfırla</button><button class="btn ghost" id="tmMode">Mola süresi</button></div>
</section>


</main>
<div id="fx" aria-hidden="true"></div>
<footer><span id="secret" role="button" tabindex="0">© 2026 Başkurt</span></footer>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let tab='notes',sub='gdov',dov=null,lib=null;

/* Sekmeler */
function show(t){
  tab=t;
  $$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $$('main>section').forEach(s=>s.classList.toggle('on',s.id===t));
  syncSub();
}
$('#nav').onclick=e=>{if(e.target.dataset.t)show(e.target.dataset.t)};
let busy=false;
function fx(label,cb){
  if(busy)return;busy=true;
  const o=$('#fx'),n=8;o.innerHTML='';
  for(let i=0;i<n;i++){const b=document.createElement('div');b.className='bar';b.style.top=(i*100/n)+'%';b.style.height=(100/n+.5)+'%';b.style.animationDelay=(i*45)+'ms';o.append(b)}
  const l=document.createElement('div');l.className='lbl';l.textContent=label;l.style.animationDelay='180ms';o.append(l);
  o.classList.add('run');
  setTimeout(cb,420);
  setTimeout(()=>{o.classList.remove('run');busy=false},1250);
}
const EMOJIS=['🎮','👾','🕹️','🔥','💀','👻','🚀','⚡','🎲','🦄','🍕','🐸','🌈','😈','🤖','🧠','🎯','💥','🐉','🍉','👽','🎃','🧨','🦖','😎','🥶','🍀','🪐','🎸','🐙'];
const rndEmoji=()=>EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
function shuffleRe(){document.querySelectorAll('.re').forEach(el=>el.textContent=rndEmoji())}
shuffleRe();
function enterZone(){const em=rndEmoji();fx(em,()=>{mountZone();document.body.classList.add('gm');$('#logoTxt').textContent=em;shuffleRe();show('zone');scrollTo(0,0)})}
function leaveZone(){fx('',()=>{document.body.classList.remove('gm');$('#logoTxt').textContent='Ders Notları';show('notes');unmountZone();scrollTo(0,0)})}
const inGm=()=>document.body.classList.contains('gm');
addEventListener('keydown',e=>{if(e.key==='Escape'){inGm()?leaveZone():show('notes')}});
$('#secret').onclick=()=>inGm()?leaveZone():enterZone();
$('#secret').onkeydown=e=>{if(e.key==='Enter')$('#secret').click()};
$('#back').onclick=leaveZone;

/* Notlar */
const na=$('#noteArea');na.value=store.get('note','');
function noteInfo(){$('#noteInfo').textContent=na.value.trim()?na.value.trim().split(/\s+/).length+' kelime':''}
na.oninput=()=>{store.set('note',na.value);noteInfo()};noteInfo();

/* Görevler */
let todos=store.get('todos',[]);
function drawTodos(){
  const ul=$('#todoList');ul.innerHTML='';
  if(!todos.length){ul.innerHTML='<li class="mute" style="padding:10px 4px">Henüz görev yok. Yukarıdan bir tane ekle.</li>';return}
  todos.forEach((t,i)=>{
    const li=document.createElement('li');li.className='t'+(t.d?' d':'');
    const c=document.createElement('input');c.type='checkbox';c.checked=t.d;c.onchange=()=>{t.d=c.checked;save()};
    const s=document.createElement('span');s.textContent=t.x;
    const x=document.createElement('button');x.textContent='×';x.setAttribute('aria-label','Sil');x.onclick=()=>{todos.splice(i,1);save()};
    li.append(c,s,x);ul.append(li);
  });
}
function save(){store.set('todos',todos);drawTodos()}
function addTodo(){const v=$('#todoIn').value.trim();if(!v)return;todos.push({x:v,d:false});$('#todoIn').value='';save()}
$('#todoAdd').onclick=addTodo;$('#todoIn').onkeydown=e=>{if(e.key==='Enter')addTodo()};drawTodos();

/* Ortalama */
function avgRow(n='',g='',w=''){
  const d=document.createElement('div');d.className='grid';
  d.innerHTML='<input type="text" placeholder="Ders adı"><input type="number" min="0" max="100" placeholder="Not"><input type="number" min="0" placeholder="Ağırlık"><button class="btn ghost" aria-label="Sil">×</button>';
  const i=d.querySelectorAll('input');i[0].value=n;i[1].value=g;i[2].value=w;
  d.querySelector('button').onclick=()=>d.remove();$('#avgRows').append(d);
}
avgRow();avgRow();
$('#avgAdd').onclick=()=>avgRow();
$('#avgCalc').onclick=()=>{
  let sum=0,wt=0;
  $$('#avgRows .grid').forEach(r=>{const i=r.querySelectorAll('input'),g=parseFloat(i[1].value),w=parseFloat(i[2].value)||1;if(!isNaN(g)){sum+=g*w;wt+=w}});
  $('#avgRes').textContent=wt?'Ortalama: '+(sum/wt).toFixed(2):'Ortalama: – (en az bir not gir)';
};

/* Odak sayacı */
let work=true,left=1500,iv=null;
function drawTm(){const m=String(Math.floor(left/60)).padStart(2,'0'),s=String(left%60).padStart(2,'0');$('#tm').textContent=m+':'+s;document.title=iv?m+':'+s+' · Ders Notları':'Ders Notları'}
$('#tmGo').onclick=()=>{
  if(iv){clearInterval(iv);iv=null;$('#tmGo').textContent='Devam';drawTm();return}
  $('#tmGo').textContent='Duraklat';
  iv=setInterval(()=>{left--;if(left<=0){clearInterval(iv);iv=null;work=!work;left=work?1500:300;$('#tmGo').textContent='Başlat'}drawTm()},1000);
};
$('#tmReset').onclick=()=>{clearInterval(iv);iv=null;left=work?1500:300;$('#tmGo').textContent='Başlat';drawTm()};
$('#tmMode').onclick=()=>{work=!work;$('#tmMode').textContent=work?'Mola süresi':'Çalışma süresi';$('#tmReset').click()};

let mounted=false;
function mountZone(){
  if(mounted)return;
  const p=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(PACK),c=>c.charCodeAt(0))));
  $('main').insertAdjacentHTML('beforeend',p.h);
  sub='gdov';
  const r=new Function('$','$$',p.j)($,$$);
  dov=r.dov;lib=r.lib;mounted=true;
}
function unmountZone(){
  if(!mounted)return;
  if(dov)dov.stop();
  if(lib)lib.close();
  const z=$('#zone');if(z)z.remove();
  dov=null;lib=null;mounted=false;
}
function syncSub(){
  if(dov)dov.stop();
  if(lib&&sub!=='gall')lib.close();
  if(tab!=='zone')return;
  if(sub==='gdov'&&dov)dov.reset();
}
drawTm();
